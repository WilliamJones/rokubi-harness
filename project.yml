# XcodeGen spec — run scripts/xcodegen.sh generate (RokubiHarness.xcodeproj is gitignored).
name: RokubiHarness
options:
  bundleIdPrefix: com.rokubi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  HarnessCore:
    path: Packages/HarnessCore
  HarnessAgent:
    path: Packages/HarnessAgent
  HarnessEditor:
    path: Packages/HarnessEditor
  HarnessTerminal:
    path: Packages/HarnessTerminal
  HarnessUI:
    path: Packages/HarnessUI

targets:
  RokubiHarness:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/Monaco/**"
      # Monaco bundle is copied as a folder reference so editor.html can resolve bridge.js next to it.
      - path: App/Resources/Monaco
        type: folder
        buildPhase: resources
    dependencies:
      - package: HarnessUI
      - package: HarnessCore
      - package: HarnessAgent
      - package: HarnessEditor
      - package: HarnessTerminal
    info:
      path: App/Info.plist
      properties:
        CFBundleName: ROKUBI Harness
        CFBundleDisplayName: ROKUBI Harness
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: © 2026 ROKUBI
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
    entitlements:
      path: App/RokubiHarness.entitlements
      properties:
        # Not sandboxed for the MVP: the harness needs arbitrary repo access and a PTY.
        com.apple.security.app-sandbox: false
        com.apple.security.cs.allow-jit: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rokubi.harness
        PRODUCT_NAME: RokubiHarness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_PREVIEWS: YES

schemes:
  RokubiHarness:
    build:
      targets:
        RokubiHarness: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
